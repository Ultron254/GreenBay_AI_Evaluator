user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Gzip compression for faster page loads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # Upstream to GreenBay Bot
    upstream greenbay_app {
        server greenbay-bot:9100;
    }

    # HTTPS server (self-signed cert for IP-based access)
    server {
        listen 443 ssl http2;
        server_name evaluator.greenbay.market 3.217.166.244 _;

        # Allow large image uploads (base64 images)
        client_max_body_size 50M;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static files caching (frontend)
        location /app/ {
            proxy_pass http://greenbay_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache static assets (JS, CSS, images) for 1 hour
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                proxy_pass http://greenbay_app;
                proxy_set_header Host $host;
                expires 1h;
                add_header Cache-Control "public, immutable";
            }
        }

        # API endpoints with rate limiting
        location /tradein/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://greenbay_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Longer timeout for AI evaluation
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # WhatsApp webhook
        location /webhook/ {
            proxy_pass http://greenbay_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check (no rate limit)
        location /health {
            proxy_pass http://greenbay_app/health;
            proxy_set_header Host $host;
        }

        # Default proxy
        location / {
            limit_req zone=general burst=10 nodelay;
            proxy_pass http://greenbay_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block sensitive paths
        location ~ /\.env { deny all; }
        location ~ /\.git { deny all; }
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name evaluator.greenbay.market 3.217.166.244 _;

        # Allow large image uploads
        client_max_body_size 50M;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check over HTTP (for Docker health checks)
        location /health {
            proxy_pass http://greenbay_app/health;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
}