<!-- Mika hero backdrop: soft light and appliance line icons drifting slowly.
     Decorative only. Each icon has a depth (--z) for the pointer parallax in
     scene.js; the drift itself is CSS and stops for reduced motion. -->
<div class="mk-sky" aria-hidden="true">
    <span class="mk-glow"></span>
    <span class="mk-ico mk-ico--wide" style="--x:3%;--y:8%;--s:40px;--t:17s;--d:-3s;--z:.5"><i data-lucide="refrigerator"></i></span>
    <span class="mk-ico mk-ico--wide" style="--x:46%;--y:6%;--s:30px;--t:21s;--d:-9s;--z:.8"><i data-lucide="microwave"></i></span>
    <span class="mk-ico" style="--x:88%;--y:4%;--s:34px;--t:19s;--d:-5s;--z:.7"><i data-lucide="washing-machine"></i></span>
    <span class="mk-ico mk-ico--wide" style="--x:52%;--y:62%;--s:46px;--t:23s;--d:-12s;--z:1"><i data-lucide="cooking-pot"></i></span>
    <span class="mk-ico mk-ico--wide" style="--x:90%;--y:46%;--s:28px;--t:16s;--d:-2s;--z:.6"><i data-lucide="coffee"></i></span>
    <span class="mk-ico mk-ico--wide" style="--x:40%;--y:90%;--s:32px;--t:20s;--d:-7s;--z:.9"><i data-lucide="blend"></i></span>
    <span class="mk-ico mk-ico--phone" style="--x:86%;--y:27%;--s:30px;--t:18s;--d:-8s;--z:.6"><i data-lucide="refrigerator"></i></span>
    <span class="mk-ico mk-ico--phone" style="--x:8%;--y:58%;--s:24px;--t:20s;--d:-3s;--z:.5"><i data-lucide="cooking-pot"></i></span>
    <span class="mk-ico" style="--x:4%;--y:92%;--s:30px;--t:18s;--d:-11s;--z:.7"><i data-lucide="fan"></i></span>
    <span class="mk-ico mk-ico--wide" style="--x:97%;--y:86%;--s:38px;--t:22s;--d:-4s;--z:.5"><i data-lucide="heater"></i></span>
    <span class="mk-ico mk-ico--wide" style="--x:30%;--y:2%;--s:24px;--t:15s;--d:-6s;--z:.4"><i data-lucide="plug"></i></span>
    <span class="mk-ico mk-ico--wide" style="--x:68%;--y:96%;--s:26px;--t:24s;--d:-14s;--z:.6"><i data-lucide="recycle"></i></span>
</div>
