<!-- Mika hero: the swap told in pictures around the example credit card.
     Old Mika (GreenBay's own photo of a used one) -> Mika credit (the card)
     -> something new from Mika (Mika's product photo). The card and this
     layer share one grid area (theme.css), so the card sits in the middle. -->
<div class="mk-art" role="group" aria-label="The swap: your old Mika becomes Mika credit, and the credit becomes something new from Mika">
    <figure class="mk-piece mk-old" data-reveal style="--i:1">
        <div class="mk-par" style="--z:1.2"><div class="mk-bob"><div class="mk-tile">
            <img src="/app/partners/mika/img/old-mika-cooker.webp" alt="A used Mika standing cooker" width="480" height="600" decoding="async">
        </div></div></div>
        <figcaption class="mk-tag">Your old Mika</figcaption>
    </figure>

    <svg class="mk-flow mk-flow--1" viewBox="0 0 120 90" aria-hidden="true" focusable="false">
        <path class="mk-flow-track" d="M6 14 C 58 4, 98 26, 108 78"></path>
        <path class="mk-flow-run" d="M6 14 C 58 4, 98 26, 108 78" pathLength="100"></path>
        <path class="mk-flow-head" d="M100 70 L108 80 L114 68"></path>
    </svg>

    <figure class="mk-piece mk-new" data-reveal style="--i:4">
        <div class="mk-par" style="--z:1.5"><div class="mk-bob"><div class="mk-tile mk-tile--white">
            <img src="/app/partners/mika/img/cooker-90cm.webp" alt="A new Mika 90 cm standing cooker" width="480" height="480" decoding="async">
        </div></div></div>
        <figcaption class="mk-tag mk-tag--new">Something new</figcaption>
    </figure>

    <svg class="mk-flow mk-flow--2" viewBox="0 0 120 90" aria-hidden="true" focusable="false">
        <path class="mk-flow-track" d="M10 6 C 14 60, 52 80, 112 74"></path>
        <path class="mk-flow-run" d="M10 6 C 14 60, 52 80, 112 74" pathLength="100"></path>
        <path class="mk-flow-head" d="M102 66 L114 74 L102 82"></path>
    </svg>

    <div class="mk-piece mk-float mk-float--kettle" aria-hidden="true" data-reveal style="--i:2">
        <div class="mk-par" style="--z:2"><div class="mk-bob"><div class="mk-tile mk-tile--white">
            <img src="/app/partners/mika/img/kettle-red.webp" alt="" width="339" height="339" decoding="async">
        </div></div></div>
    </div>
    <div class="mk-piece mk-float mk-float--micro" aria-hidden="true" data-reveal style="--i:3">
        <div class="mk-par" style="--z:1.7"><div class="mk-bob"><div class="mk-tile mk-tile--white">
            <img src="/app/partners/mika/img/microwave.webp" alt="" width="480" height="480" decoding="async">
        </div></div></div>
    </div>
</div>
