<!-- The swap, told in pictures: old one, credit, new one. A slow loop lights
     each stage in turn (theme.css); it holds still for reduced motion. -->
<section class="vp-swap" aria-labelledby="vpSwapTitle">
    <div class="p-wrap">
        <h2 class="vp-eyebrow" id="vpSwapTitle" data-reveal>The swap in one look</h2>
        <ol class="vp-swap-row" data-reveal>
            <li class="vp-swap-card vp-swap-card--old">
                <div class="vp-swap-pic">
                    <img src="/app/partners/vision-plus/img/old-tv-32.webp" width="469" height="314"
                         alt="An older Vision Plus TV" loading="lazy" decoding="async">
                </div>
                <p>Your old Vision Plus</p>
                <span class="vp-swap-link" aria-hidden="true"><span class="vp-beam"></span><i data-lucide="arrow-right"></i></span>
            </li>
            <li class="vp-swap-card vp-swap-card--credit">
                <div class="vp-swap-pic">
                    <div class="vp-ticket">
                        <img src="/app/partners/vision-plus/vision-plus-logo-white.svg" width="110" height="24"
                             alt="Vision Plus" class="vp-ticket-logo" loading="lazy">
                        <span class="vp-ticket-amt"><small>KES</small> <span data-countup="6500">6,500</span></span>
                        <span class="vp-ticket-sub">Example credit</span>
                    </div>
                </div>
                <p>Becomes Vision Plus credit</p>
                <span class="vp-swap-link" aria-hidden="true"><span class="vp-beam"></span><i data-lucide="arrow-right"></i></span>
            </li>
            <li class="vp-swap-card vp-swap-card--new">
                <div class="vp-swap-pic">
                    <img src="/app/partners/vision-plus/img/tv-43-home.webp" width="640" height="624"
                         alt="A new Vision Plus QLED TV, switched on" loading="lazy" decoding="async">
                </div>
                <p>Towards a new one</p>
            </li>
        </ol>
    </div>
</section>
