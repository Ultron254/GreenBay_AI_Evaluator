<!-- A TV tip before the wizard, shown rather than told: a TV switched on,
     a record dot, one line. -->
<aside class="vp-tip" aria-labelledby="vpTipTitle">
    <div class="p-wrap">
        <div class="vp-tip-card" data-reveal>
            <div class="vp-tip-pic">
                <img src="/app/partners/vision-plus/img/tv-65-vidaa.webp" width="640" height="624"
                     alt="A Vision Plus TV switched on, showing a football match" loading="lazy" decoding="async">
                <span class="vp-rec" aria-hidden="true"><span></span>REC</span>
            </div>
            <div class="vp-tip-copy">
                <p class="vp-tip-k"><i data-lucide="video" aria-hidden="true"></i>Swapping a TV?</p>
                <h2 class="vp-tip-t" id="vpTipTitle">Film it switched on for a few seconds.</h2>
                <p class="vp-tip-b">Add the clip with your photos. It helps us value your TV fairly.</p>
            </div>
        </div>
    </div>
</aside>
