<!-- Vision Plus hero stage: a new Vision Plus TV in its own glow, with the
     range floating around it. The example credit card (in the template)
     sits over its lower corner: old one in, credit out, new one home. -->
<div class="vp-stage" data-vp-parallax>
    <div class="vp-halo" aria-hidden="true"></div>
    <div class="vp-layer vp-layer--tv" style="--z:.35">
        <div class="vp-tv">
            <img src="/app/partners/vision-plus/img/tv-55-qled.webp" width="760" height="740"
                 alt="A new Vision Plus 55 inch 4K QLED TV" fetchpriority="high" decoding="async">
        </div>
    </div>
    <div class="vp-layer vp-float vp-float--washer" style="--z:.9;--t:7.5s;--d:-1s">
        <img src="/app/partners/vision-plus/img/washer-front-load.webp" width="438" height="520"
             alt="Vision Plus front load washing machine" decoding="async">
    </div>
    <div class="vp-layer vp-float vp-float--fridge" style="--z:.7;--t:9s;--d:-4s">
        <img src="/app/partners/vision-plus/img/fridge-side-by-side.webp" width="253" height="520"
             alt="Vision Plus side by side fridge" decoding="async">
    </div>
    <div class="vp-layer vp-float vp-float--sound" style="--z:1.2;--t:8s;--d:-2.5s">
        <img src="/app/partners/vision-plus/img/soundbar-soundpro480.webp" width="560" height="389"
             alt="Vision Plus soundbar with subwoofer" decoding="async">
    </div>
    <div class="vp-layer vp-float vp-float--micro" style="--z:1;--t:6.5s;--d:-5s">
        <img src="/app/partners/vision-plus/img/microwave-grill.webp" width="520" height="316"
             alt="Vision Plus microwave" decoding="async">
    </div>
    <span class="vp-chip vp-chip--a" aria-hidden="true"><i data-lucide="badge-check"></i>Checked by GreenBay</span>
    <span class="vp-chip vp-chip--b" aria-hidden="true"><i data-lucide="calendar-clock"></i>90 days to spend</span>
</div>
