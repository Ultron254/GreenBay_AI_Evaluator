<!-- Vision Plus hero backdrop: screen glow, a slow light sweep, faint scan
     lines and drifting line icons. Decorative only; scene.js adds pointer
     parallax, theme.css stops it all for prefers-reduced-motion. -->
<div class="vp-backdrop" aria-hidden="true">
    <div class="vp-glow"></div>
    <div class="vp-scan"></div>
    <div class="vp-sweep"></div>
    <div class="vp-icons">
        <span class="vp-ico" style="--x:6%;--y:12%;--s:34px;--t:17s;--d:-3s;--z:.5"><i data-lucide="tv"></i></span>
        <span class="vp-ico" style="--x:44%;--y:7%;--s:26px;--t:21s;--d:-9s;--z:.8"><i data-lucide="speaker"></i></span>
        <span class="vp-ico vp-ico--wide" style="--x:52%;--y:84%;--s:30px;--t:19s;--d:-6s;--z:.6"><i data-lucide="refrigerator"></i></span>
        <span class="vp-ico" style="--x:3%;--y:88%;--s:28px;--t:23s;--d:-12s;--z:.9"><i data-lucide="washing-machine"></i></span>
        <span class="vp-ico vp-ico--wide" style="--x:93%;--y:10%;--s:30px;--t:18s;--d:-4s;--z:.7"><i data-lucide="microwave"></i></span>
        <span class="vp-ico vp-ico--wide" style="--x:96%;--y:62%;--s:24px;--t:20s;--d:-15s;--z:.4"><i data-lucide="cooking-pot"></i></span>
        <span class="vp-ico" style="--x:30%;--y:93%;--s:22px;--t:16s;--d:-7s;--z:1"><i data-lucide="headphones"></i></span>
        <span class="vp-ico vp-ico--wide" style="--x:70%;--y:4%;--s:22px;--t:22s;--d:-2s;--z:.6"><i data-lucide="sparkles"></i></span>
        <span class="vp-ico vp-ico--wide" style="--x:83%;--y:93%;--s:26px;--t:24s;--d:-10s;--z:.8"><i data-lucide="audio-lines"></i></span>
    </div>
</div>
