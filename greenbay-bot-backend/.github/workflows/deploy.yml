name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ubuntu
  DEPLOY_KEY: ${{ secrets.EC2_SSH_KEY }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd /opt/greenbay
            echo "📦 Pulling latest changes..."
            git pull origin main

            echo "🔨 Building containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache app

            echo "🚀 Starting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            echo "⏳ Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:9100/health > /dev/null 2>&1; then
                echo "✅ App is healthy!"
                exit 0
              fi
              echo "  Attempt $i/30..."
              sleep 10
            done

            echo "❌ Health check failed after 5 minutes"
            docker compose logs --tail=50 app
            exit 1

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deployment failed! Check the logs above."
