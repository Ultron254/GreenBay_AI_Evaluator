# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    restart: always
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  qdrant:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for Let's Encrypt http-01 challenges (see nginx.conf). Required
      # so certbot renewals can be validated and the cert never silently expires.
      - /var/www/certbot:/var/www/certbot:ro
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  shopify-sync:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
