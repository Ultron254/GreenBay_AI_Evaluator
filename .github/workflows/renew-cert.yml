name: Renew TLS Certificate

# Renews the Let's Encrypt certificate for evaluate.greenbay.market.
#  - Manual run (workflow_dispatch): forces a fresh certificate immediately and
#    (re)points the renewal config at the webroot + an nginx-reload deploy hook.
#  - Weekly schedule: a non-forcing backstop in case the host's own
#    certbot.timer ever fails again (only renews when within 30 days of expiry).
#
# Renewal uses the webroot method (no nginx downtime). The real fix for the
# silent-expiry bug is the /var/www/certbot mount added to the nginx service in
# docker-compose.yml. The server-side `git pull` is authenticated with the
# short-lived Actions token so it doesn't depend on a stored PAT on the server.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'  # Mondays 03:17 UTC

permissions:
  contents: read

jobs:
  renew:
    name: Renew Let's Encrypt certificate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Renew certificate over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 8m
          script_stop: false
          envs: EVENT,GH_TOKEN
          script: |
            set +e  # we capture and report errors explicitly below
            DOMAIN="evaluate.greenbay.market"
            EMAIL="allanmatano@greenbay.market"
            REPO="https://x-access-token:${GH_TOKEN}@github.com/Ultron254/GreenBay_AI_Evaluator.git"

            echo "=== Ensure webroot exists on host ==="
            sudo mkdir -p /var/www/certbot

            echo "=== Sync code to origin/main (compose mounts /var/www/certbot) ==="
            cd /opt/greenbay || exit 1
            # fetch + hard reset (plain pull breaks on divergent local history).
            sudo git fetch "$REPO" main && sudo git reset --hard FETCH_HEAD || { echo "::error::git sync failed"; exit 1; }
            cd greenbay-bot-backend || exit 1

            echo "=== Recreate nginx so the webroot mount is live ==="
            sudo docker compose up -d nginx
            sleep 5

            echo "=== Locate certbot ==="
            CB="$(sudo bash -lc 'command -v certbot' 2>/dev/null)"
            if [ -z "$CB" ]; then
              if [ -x /snap/bin/certbot ]; then CB=/snap/bin/certbot
              elif [ -x /usr/bin/certbot ]; then CB=/usr/bin/certbot
              fi
            fi
            if [ -z "$CB" ]; then
              echo "certbot not found — installing via snap"
              sudo snap install --classic certbot && sudo ln -sf /snap/bin/certbot /usr/bin/certbot
              CB=/snap/bin/certbot
            fi
            echo "Using certbot: ${CB:-NONE}"
            sudo "$CB" --version 2>&1 || true

            HOOK="docker exec greenbay-nginx nginx -s reload"
            # Manual runs force a fresh cert; the weekly schedule only renews when
            # within 30 days of expiry (avoids Let's Encrypt rate limits).
            FLAGS="--force-renewal"
            if [ "$EVENT" = "schedule" ]; then FLAGS="--keep-until-expiring"; fi
            echo "=== Renewing via webroot (flags='${FLAGS}') ==="
            sudo "$CB" certonly --webroot -w /var/www/certbot \
              -d "$DOMAIN" \
              --non-interactive --agree-tos -m "$EMAIL" \
              $FLAGS \
              --deploy-hook "$HOOK" 2>&1
            RC=$?
            echo "certbot exit code: $RC"

            echo "=== Reload nginx to pick up the new cert ==="
            sudo docker exec greenbay-nginx nginx -s reload 2>&1 || sudo docker restart greenbay-nginx

            echo "=== Certificate status ==="
            sudo "$CB" certificates 2>&1 | grep -E "Certificate Name|Expiry Date|Domains" || true

            exit $RC
