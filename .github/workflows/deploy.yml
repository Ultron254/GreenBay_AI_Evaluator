name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: read  # lets the job's GITHUB_TOKEN pull the repo on the server

# Serialize anything that touches the EC2 host. The renew-cert workflow shares
# this same group, so a deploy and a cert renewal can NEVER run Docker commands
# on the server at the same time. (A concurrent deploy + renew once collided on
# `docker compose` container removal and took the site offline.) New runs queue
# behind the in-flight one instead of cancelling it.
concurrency:
  group: greenbay-ec2-server
  cancel-in-progress: false

jobs:
  test:
    name: Run tests (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: greenbay-bot-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        # The deterministic engine/service tests only need loguru + pytest
        # (config is pure constants; gspread/google clients are imported lazily).
        run: pip install pytest pytest-asyncio loguru pydantic

      - name: Run pytest
        run: python -m pytest greenbay_ai_evaluator/tests/ -q

  deploy:
    name: Deploy to Production
    needs: test          # deploy is BLOCKED unless the test gate passes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
          # Runtime API keys delivered via GitHub secrets — the server has no
          # Session Manager access, so the deploy pipeline is the secure path
          # for getting secrets into the server's .env.
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          script_stop: true
          envs: GH_TOKEN,PERPLEXITY_API_KEY
          script: |
            set -e
            echo "=== Syncing code to origin/main ==="
            cd /opt/greenbay
            # Authenticate with the short-lived Actions token (no stored PAT needed,
            # the old one expired). Force the checkout to mirror origin/main: plain
            # `git pull` breaks on divergent local history, so fetch + hard reset is
            # deterministic. Only tracked files are touched — runtime data dirs are
            # bind-mounted and gitignored.
            sudo git fetch "https://x-access-token:${GH_TOKEN}@github.com/Ultron254/GreenBay_AI_Evaluator.git" main
            sudo git reset --hard FETCH_HEAD

            echo "=== Rebuilding containers ==="
            cd greenbay-bot-backend

            # Upsert runtime secrets from GitHub Actions into the server .env.
            # Idempotent: replaces any existing line, appends if missing, and is
            # skipped entirely when the repo secret is not set.
            if [ -n "${PERPLEXITY_API_KEY}" ]; then
              echo "=== Writing PERPLEXITY_API_KEY into .env ==="
              sudo sed -i '/^PERPLEXITY_API_KEY=/d' .env
              echo "PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}" | sudo tee -a .env > /dev/null
            fi

            # Ensure bind-mounted host directories exist and are writable by
            # the non-root appuser inside the container. The Dockerfile chmods
            # /app/logs etc. to 777 at image-build time, but bind mounts override
            # that with the host directory's permissions, which can be root:root
            # after a `stop + rm` cycle. Fixing it here keeps the deploy idempotent.
            sudo mkdir -p logs temp_images receipts airtable_fallback credentials
            # Recursive chmod so existing files (e.g. a pre-existing
            # greenbay.log owned by root) also become writable by the
            # container's non-root appuser.
            sudo chmod -R 777 logs temp_images receipts airtable_fallback
            sudo chmod 755 credentials

            # Reclaim disk before building. A full disk previously broke the
            # image build ("no space left on device"). Prune build cache and
            # unused/dangling images + stopped containers. NEVER prune volumes —
            # that would delete the postgres/redis data.
            echo "=== Disk usage before cleanup ==="
            df -h / || true
            sudo docker builder prune -af || true
            sudo docker image prune -af || true
            sudo docker container prune -f || true
            echo "=== Disk usage after cleanup ==="
            df -h / || true

            sudo docker compose build

            # Stop and remove the two containers we always rebuild. Previous
            # deploys occasionally left `greenbay-shopify-sync` in a stuck
            # "running but not removable" state, which caused `up -d` to abort
            # with "cannot remove container". Doing this explicitly first is
            # deterministic and keeps postgres/redis/qdrant up for fast recovery.
            sudo docker compose stop app shopify-sync || true
            sudo docker compose rm -f app shopify-sync || true
            # Belt-and-suspenders: compose rm only removes containers it still
            # tracks. A dangling container left under the raw name (e.g. after a
            # crashed run) makes `up` abort with "name already in use". Force
            # remove by explicit name so a stale container can never block deploy.
            sudo docker rm -f greenbay-bot greenbay-shopify-sync 2>/dev/null || true

            # Bring everything up. If up fails, dump the app container logs so we
            # can diagnose without needing to SSH in.
            if ! sudo docker compose up -d --remove-orphans; then
              echo "::error::docker compose up -d failed; dumping app logs..."
              sudo docker compose logs --tail=300 app || true
              exit 1
            fi

            # Run migrations BEFORE gating on health. A release may ship code that
            # needs a new column, so the app can only become healthy AFTER the
            # schema is upgraded — running alembic after the health gate risked a
            # deadlock. First wait for the container to be *running* (not yet
            # healthy) so we can exec into it.
            echo "=== Waiting for greenbay-bot to be running ==="
            for i in $(seq 1 24); do
              state="$(sudo docker inspect -f '{{.State.Running}}' greenbay-bot 2>/dev/null || echo false)"
              if [ "$state" = "true" ]; then break; fi
              sleep 5
            done

            echo "=== Running database migrations (alembic upgrade head) ==="
            if ! sudo docker exec greenbay-bot alembic upgrade head; then
              echo "::error::alembic upgrade head FAILED — schema is out of date!"
              echo "--- current revision ---"
              sudo docker exec greenbay-bot alembic current || true
              echo "--- heads ---"
              sudo docker exec greenbay-bot alembic heads || true
              exit 1
            fi
            echo "--- confirming single head ---"
            sudo docker exec greenbay-bot alembic heads || true

            # Now wait (up to 3 min) for the app to report healthy.
            echo "=== Waiting for greenbay-bot to become healthy ==="
            healthy=""
            for i in $(seq 1 36); do
              status="$(sudo docker inspect -f '{{.State.Health.Status}}' greenbay-bot 2>/dev/null || echo unknown)"
              echo "  attempt $i: $status"
              if [ "$status" = "healthy" ]; then healthy=1; break; fi
              if [ "$status" = "unhealthy" ]; then
                echo "::error::greenbay-bot went unhealthy; dumping logs..."
                sudo docker compose logs --tail=300 app || true
                exit 1
              fi
              sleep 5
            done
            if [ -z "$healthy" ]; then
              echo "::error::greenbay-bot never became healthy after 3 min; dumping logs..."
              sudo docker compose logs --tail=300 app || true
              exit 1
            fi

            echo "=== Seeding pricing policies ==="
            sudo docker exec greenbay-bot python3 scripts/seed_pricing_policy.py || true

            echo "=== Verifying HTTP /health ==="
            curl -sf http://localhost:9100/health || (
              echo "HEALTH CHECK FAILED"
              sudo docker compose logs --tail=200 app || true
              exit 1
            )

            echo "=== Post-deploy smoke test (real evaluation) ==="
            # Run one full evaluation against the live container, assert it returns
            # a priced result, then delete the probe row from Airtable + the
            # tracker sheet so no test data is left behind. Catches runtime wiring
            # regressions unit tests can't (DB/Airtable/Gemini).
            #
            # NON-BLOCKING by design: the first heavy (Gemini-grounded) request
            # right after a cold start can transiently reset, and Gemini itself can
            # rate-limit. A failure here emits a ::warning:: annotation (visible)
            # but does NOT fail the deploy — the unit-test gate already blocks
            # logic regressions, and health + migrations have already passed.
            sleep 8  # let the freshly-started worker warm up
            SMOKE_PAYLOAD='{"category":"tv_monitor","brand":"Samsung","model":"ZZSMOKE-CI","age_years":2,"condition_grade":"B","condition_score":70,"retail_price":50000,"retail_price_source":"category_default","seller_name":"ZZSMOKE CI","seller_phone":"+254700000000","country":"KE"}'
            SMOKE_RESP=""
            for n in 1 2 3; do
              SMOKE_RESP="$(curl -s --max-time 120 -X POST -H 'Content-Type: application/json' -d "$SMOKE_PAYLOAD" http://localhost:9100/tradein/evaluate || true)"
              if echo "$SMOKE_RESP" | grep -q 'opening_offer'; then break; fi
              echo "  smoke attempt $n: no priced result yet, retrying in 8s..."
              sleep 8
            done
            if echo "$SMOKE_RESP" | grep -q 'opening_offer'; then
              SID="$(echo "$SMOKE_RESP" | sed -n 's/.*"session_id"[: ]*"\([^"]*\)".*/\1/p' | cut -c1-8)"
              echo "Smoke OK (session ${SID}); cleaning up probe row..."
              if [ -n "$SID" ]; then
                ADMIN_KEY="$(sudo docker exec greenbay-bot printenv DASHBOARD_KEY 2>/dev/null || echo greenbay-admin-2026)"
                curl -s -X POST -H "X-Admin-Key: ${ADMIN_KEY}" \
                  "http://localhost:9100/tradein/admin/delete-eval-record?ref=${SID}" || true
              fi
            else
              echo "::warning::Post-deploy smoke test did not return a priced result after 3 tries (likely transient Gemini/cold-start). Last response: $(echo "$SMOKE_RESP" | head -c 300)"
            fi

            # Sweep ANY leftover ZZ probe rows (this run's or an earlier failed
            # cleanup's) out of Airtable + the tracker sheet. Idempotent.
            echo "=== Purging leftover test/probe rows ==="
            ADMIN_KEY="$(sudo docker exec greenbay-bot printenv DASHBOARD_KEY 2>/dev/null || echo greenbay-admin-2026)"
            curl -s --max-time 180 -X POST -H "X-Admin-Key: ${ADMIN_KEY}" \
              "http://localhost:9100/tradein/admin/purge-test-records?dry_run=false" || true

            echo ""
            echo "=== Deploy successful ==="
            sudo docker ps --format '{{.Names}} {{.Status}}'

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deployment to EC2 failed! Check the logs above."
