name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  test:
    name: Run tests (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: greenbay-bot-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        # The deterministic engine/service tests only need loguru + pytest
        # (config is pure constants; gspread/google clients are imported lazily).
        run: pip install pytest pytest-asyncio loguru pydantic

      - name: Run pytest
        run: python -m pytest greenbay_ai_evaluator/tests/ -q

  deploy:
    name: Deploy to Production
    needs: test          # deploy is BLOCKED unless the test gate passes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd /opt/greenbay
            sudo git pull origin main

            echo "=== Rebuilding containers ==="
            cd greenbay-bot-backend

            # Ensure bind-mounted host directories exist and are writable by
            # the non-root appuser inside the container. The Dockerfile chmods
            # /app/logs etc. to 777 at image-build time, but bind mounts override
            # that with the host directory's permissions, which can be root:root
            # after a `stop + rm` cycle. Fixing it here keeps the deploy idempotent.
            sudo mkdir -p logs temp_images receipts airtable_fallback credentials
            # Recursive chmod so existing files (e.g. a pre-existing
            # greenbay.log owned by root) also become writable by the
            # container's non-root appuser.
            sudo chmod -R 777 logs temp_images receipts airtable_fallback
            sudo chmod 755 credentials

            sudo docker compose build

            # Stop and remove the two containers we always rebuild. Previous
            # deploys occasionally left `greenbay-shopify-sync` in a stuck
            # "running but not removable" state, which caused `up -d` to abort
            # with "cannot remove container". Doing this explicitly first is
            # deterministic and keeps postgres/redis/qdrant up for fast recovery.
            sudo docker compose stop app shopify-sync || true
            sudo docker compose rm -f app shopify-sync || true
            # Belt-and-suspenders: compose rm only removes containers it still
            # tracks. A dangling container left under the raw name (e.g. after a
            # crashed run) makes `up` abort with "name already in use". Force
            # remove by explicit name so a stale container can never block deploy.
            sudo docker rm -f greenbay-bot greenbay-shopify-sync 2>/dev/null || true

            # Bring everything up. If up fails, dump the app container logs so we
            # can diagnose without needing to SSH in.
            if ! sudo docker compose up -d --remove-orphans; then
              echo "::error::docker compose up -d failed; dumping app logs..."
              sudo docker compose logs --tail=300 app || true
              exit 1
            fi

            # Run migrations BEFORE gating on health. A release may ship code that
            # needs a new column, so the app can only become healthy AFTER the
            # schema is upgraded — running alembic after the health gate risked a
            # deadlock. First wait for the container to be *running* (not yet
            # healthy) so we can exec into it.
            echo "=== Waiting for greenbay-bot to be running ==="
            for i in $(seq 1 24); do
              state="$(sudo docker inspect -f '{{.State.Running}}' greenbay-bot 2>/dev/null || echo false)"
              if [ "$state" = "true" ]; then break; fi
              sleep 5
            done

            echo "=== Running database migrations (alembic upgrade head) ==="
            if ! sudo docker exec greenbay-bot alembic upgrade head; then
              echo "::error::alembic upgrade head FAILED — schema is out of date!"
              echo "--- current revision ---"
              sudo docker exec greenbay-bot alembic current || true
              echo "--- heads ---"
              sudo docker exec greenbay-bot alembic heads || true
              exit 1
            fi
            echo "--- confirming single head ---"
            sudo docker exec greenbay-bot alembic heads || true

            # Now wait (up to 3 min) for the app to report healthy.
            echo "=== Waiting for greenbay-bot to become healthy ==="
            healthy=""
            for i in $(seq 1 36); do
              status="$(sudo docker inspect -f '{{.State.Health.Status}}' greenbay-bot 2>/dev/null || echo unknown)"
              echo "  attempt $i: $status"
              if [ "$status" = "healthy" ]; then healthy=1; break; fi
              if [ "$status" = "unhealthy" ]; then
                echo "::error::greenbay-bot went unhealthy; dumping logs..."
                sudo docker compose logs --tail=300 app || true
                exit 1
              fi
              sleep 5
            done
            if [ -z "$healthy" ]; then
              echo "::error::greenbay-bot never became healthy after 3 min; dumping logs..."
              sudo docker compose logs --tail=300 app || true
              exit 1
            fi

            echo "=== Seeding pricing policies ==="
            sudo docker exec greenbay-bot python3 scripts/seed_pricing_policy.py || true

            echo "=== Verifying HTTP /health ==="
            curl -sf http://localhost:9100/health || (
              echo "HEALTH CHECK FAILED"
              sudo docker compose logs --tail=200 app || true
              exit 1
            )

            echo "=== Post-deploy smoke test (real evaluation) ==="
            # Run one full evaluation against the live container, assert it
            # returns a priced result, then delete the probe row from Airtable +
            # the tracker sheet so no test data is left behind. Catches runtime
            # regressions that unit tests can't (DB/Airtable/Gemini wiring).
            SMOKE_PAYLOAD='{"category":"tv_monitor","brand":"Samsung","model":"ZZSMOKE-CI","age_years":2,"condition_grade":"B","condition_score":70,"retail_price":50000,"retail_price_source":"category_default","seller_name":"ZZSMOKE CI","seller_phone":"+254700000000","country":"KE"}'
            SMOKE_RESP="$(curl -sf -X POST -H 'Content-Type: application/json' -d "$SMOKE_PAYLOAD" http://localhost:9100/tradein/evaluate)" || {
              echo '::error::Smoke test FAILED — /tradein/evaluate did not return 200'
              sudo docker compose logs --tail=200 app || true
              exit 1
            }
            echo "$SMOKE_RESP" | grep -q 'opening_offer' || {
              echo '::error::Smoke test FAILED — response missing opening_offer'
              echo "$SMOKE_RESP"
              exit 1
            }
            SID="$(echo "$SMOKE_RESP" | sed -n 's/.*"session_id"[: ]*"\([^"]*\)".*/\1/p' | cut -c1-8)"
            echo "Smoke OK (session ${SID}); cleaning up probe row..."
            if [ -n "$SID" ]; then
              ADMIN_KEY="$(sudo docker exec greenbay-bot printenv DASHBOARD_KEY 2>/dev/null || echo greenbay-admin-2026)"
              curl -s -X POST -H "X-Admin-Key: ${ADMIN_KEY}" \
                "http://localhost:9100/tradein/admin/delete-eval-record?ref=${SID}" || true
            fi

            echo ""
            echo "=== Deploy successful ==="
            sudo docker ps --format '{{.Names}} {{.Status}}'

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deployment to EC2 failed! Check the logs above."
