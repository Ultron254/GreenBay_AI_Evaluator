name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd /opt/greenbay
            sudo git pull origin main

            echo "=== Rebuilding containers ==="
            cd greenbay-bot-backend

            # Ensure bind-mounted host directories exist and are writable by
            # the non-root appuser inside the container. The Dockerfile chmods
            # /app/logs etc. to 777 at image-build time, but bind mounts override
            # that with the host directory's permissions, which can be root:root
            # after a `stop + rm` cycle. Fixing it here keeps the deploy idempotent.
            sudo mkdir -p logs temp_images receipts airtable_fallback credentials
            # Recursive chmod so existing files (e.g. a pre-existing
            # greenbay.log owned by root) also become writable by the
            # container's non-root appuser.
            sudo chmod -R 777 logs temp_images receipts airtable_fallback
            sudo chmod 755 credentials

            sudo docker compose build

            # Stop and remove the two containers we always rebuild. Previous
            # deploys occasionally left `greenbay-shopify-sync` in a stuck
            # "running but not removable" state, which caused `up -d` to abort
            # with "cannot remove container". Doing this explicitly first is
            # deterministic and keeps postgres/redis/qdrant up for fast recovery.
            sudo docker compose stop app shopify-sync || true
            sudo docker compose rm -f app shopify-sync || true
            # Belt-and-suspenders: compose rm only removes containers it still
            # tracks. A dangling container left under the raw name (e.g. after a
            # crashed run) makes `up` abort with "name already in use". Force
            # remove by explicit name so a stale container can never block deploy.
            sudo docker rm -f greenbay-bot greenbay-shopify-sync 2>/dev/null || true

            # Bring everything up. If up fails, dump the app container logs so we
            # can diagnose without needing to SSH in.
            if ! sudo docker compose up -d --remove-orphans; then
              echo "::error::docker compose up -d failed; dumping app logs..."
              sudo docker compose logs --tail=300 app || true
              exit 1
            fi

            # Wait (up to 3 min) for the app container to become healthy before
            # moving on. The Dockerfile healthcheck uses start_period=180s.
            echo "=== Waiting for greenbay-bot to become healthy ==="
            healthy=""
            for i in $(seq 1 36); do
              status="$(sudo docker inspect -f '{{.State.Health.Status}}' greenbay-bot 2>/dev/null || echo unknown)"
              echo "  attempt $i: $status"
              if [ "$status" = "healthy" ]; then healthy=1; break; fi
              if [ "$status" = "unhealthy" ]; then
                echo "::error::greenbay-bot went unhealthy; dumping logs..."
                sudo docker compose logs --tail=300 app || true
                exit 1
              fi
              sleep 5
            done
            if [ -z "$healthy" ]; then
              echo "::error::greenbay-bot never became healthy after 3 min; dumping logs..."
              sudo docker compose logs --tail=300 app || true
              exit 1
            fi

            echo "=== Running database migrations (alembic upgrade head) ==="
            if ! sudo docker exec greenbay-bot alembic upgrade head; then
              echo "::error::alembic upgrade head FAILED — schema is out of date!"
              echo "--- current revision ---"
              sudo docker exec greenbay-bot alembic current || true
              echo "--- heads ---"
              sudo docker exec greenbay-bot alembic heads || true
              exit 1
            fi
            echo "--- confirming single head ---"
            sudo docker exec greenbay-bot alembic heads || true

            echo "=== Seeding pricing policies ==="
            sudo docker exec greenbay-bot python3 scripts/seed_pricing_policy.py || true

            echo "=== Verifying HTTP /health ==="
            curl -sf http://localhost:9100/health || (
              echo "HEALTH CHECK FAILED"
              sudo docker compose logs --tail=200 app || true
              exit 1
            )
            echo ""
            echo "=== Deploy successful ==="
            sudo docker ps --format '{{.Names}} {{.Status}}'

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deployment to EC2 failed! Check the logs above."
